<!doctype html>
<html lang="en">
  <head>

      if (umur >= 17){
        console.log("kamu bisa bikin ktp")
      } else {
        console.log("kamu belom bisa bikin ktp")
      }
    </script>
  </head>
  <body> 
    <h1 id="nama">jdfhsdifhlasdkjhfliasdfhjiasdhfuklsd</h1>
