<!-- 
 1. apa kepanjangan dr HTML ? ismail
 2. cara membuat struktur dasar HTML di vscode ? ismail
 3. sebutkan elemen paling dasar pada struktur HTML
    <html>, <head>, <title> <body> nizar
 4. fungsi elemen head: menampung elemen yg berkaitan dg pengaturan website baik logika maupun tampilan nizar
 5. fungsi elemen title fathan
 6. fungsi elemen body fathan
 7. fungsi elemen heading ? sebutkan rentangnya ! akmal
 8. fungsi elemen paragraph ? akmal
 9. fungsi elemen anchor ? faruq
 10.fungsi elemen span ? faruq
-->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Judul Website</title>
  <!-- fungsi elemen title memberikan judul pada tab browser -->
   <style>
    .merahmerona{
      color: red;
      font-size: 30px;
    }
   </style>
</head>
<body>
  <!-- fungsi elemen body menampung elemen yang ingin ditampilkan pada website -->
  <h1>Reza</h1>     
  <!-- heading fungsinya u/ menampilkan teks judul pada website - rentangnya h1 - h6 -->
  <p>domisili di cileungsi, <span class="merahmerona">bogor,</span> jawa barat</p>
  <!-- fungsi elemen paragraph u/ mendeskripsikan heading maupun teks bebas -->
  <!-- fungsi elemen span u/ menyelipkan kata pada teks -->
  <a href="https://google.co.id">klik disini untuk beralih ke google</a>
  <!-- fungsi elemen anchor u/ mengalihkan ke link tertentu -->
</body>
</html>
