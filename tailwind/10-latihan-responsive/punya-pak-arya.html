<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="https://www.dumetschool.com/assets/images/dsicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body class="bg-gradient-to-r from-blue-400 to-blue-900 min-h-screen flex justify-center items-center p-10">
    <div class="w-full max-w-[1200px] mx-auto bg-white rounded-2xl p-6 md:p-10">
        <div class="flex flex-col md:flex-row gap-8 ">
            <div class="w-full md:w-10/12 min-w-0">
                <div class="flex flex-wrap items-center gap-4 mb-8">
                    <div class="flex items-center gap-2 bg-blue-200 text-blue-700 px-4 rounded-full h-9">
                        <i class="fa-solid fa-plane"></i>
                        <span class="text-sm font-semibold">TRAVEL</span>
                    </div>
                    <div class="flex items-center gap-1 text-gray-800 px-4 py-2 border-l border-gray-300 ">
                        <i class="fa-solid fa-location-dot"></i>
                        <span class="text-sm font-semibold">Sommaroy, Norway</span>
                    </div>
                </div>
                <div class="mb-6">
                    <h1 class="text-3xl md:text-4xl lg:text-5xl font-serif font-semibold leading-tight text-blue-950">
                        The Norwegian Island That wanted To Abolish Time
                    </h1>
                    <p class="mt-5 text-base md:text-lg leading-relaxed text-gray-500">
                        Seven Years After A Bizarre Plan To Abolish Made Headlines, What is life Really Like On This Remote Arctic Island?
                    </p>
                </div>
                <div class="flex items-center gap-3 mb-5">
                    <div class="w-14 h-14 shrink-0 rounded-full bg-gray-100 overflow-hidden">
                        <img src="images/avatar.png" alt="avatar" class="w-full h-full object-cover">
                    </div>
   
                    <div class="flex flex-col">
                        <span class="text-sm font-semibold text-gray-800">By Muhammad</span>
                    </div>
                    <div class="flex flex-col">
                        <!-- Membuat Bullet Pemisah -->
                         <span class="text-sm font-semibold text-gray-800 w-1 h-1 rounded-full bg-gray-400"></span>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-sm font-semibold text-gray-400">Travel Writer</span>
                    </div>
                </div>
                <div class="flex flex-wrap items-center gap-x-4 gap-y-3 border-t border-gray-200 pt-5">
                    <div class="flex items-center gap-2 text-gray-500">
                        <i class="fa-regular fa-calendar"></i>
                        <span class="text-sm">Apr 12, 2024</span>
                    </div>
                    <div class="flex items-center gap-2 text-gray-500">
                        <i class="fa-regular fa-clock"></i>
                        <span class="5 Min Read"></span>
                    </div>
                    <div class="flex items-center row-gap-xl-0 text-gray-500">
                        <i class="fa-solid fa-star text-yellow-500"></i>
                        <i class="fa-solid fa-star text-yellow-500"></i>
                        <i class="fa-solid fa-star text-yellow-500"></i>
                        <i class="fa-solid fa-star text-yellow-500"></i>
                        <i class="fa-solid fa-star-half-stroke text-yellow-500"></i>
                        <span class="text-sm pl-2">>(2.3k Reviews)</span>
                    </div>
                </div>
            </div>
            <div class="w-full md:w-12/12 min-w-0">
                <div class="w-full">
                    <img src="./images/norway.png" alt="norway" class="w-full aspect-video md:aspect-[11/10] object-cover rounded-2xl">
                </div>
            </div>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-5 mt-8">
            <div class="flex flex-wrap items-center gap-4">
                <a href="#" class="inline-flex items-center justify-center gap-3 bg-blue-600 hover:bg-blue-700 text-white font-medium px-7 py-4 rounded-xl shadow-lg shadow-blue-200 transition-colors">
                    Read Story
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
                <button type="button" class="inline-flex items-center gap-3 border border-gray-200 hover:bg-gray-50 text-blue-950 px-6 py-4 rounded-xl transition-colors cursor-pointer">
                    <i class="fa-solid fa-share-nodes"></i>
                    Share
                </button>
            </div>
            <div class="flex flex-wrap items-center gap-5">
                <button type="button" class="flex items-center gap-2 text-blue-950 hover:text-red-500 transition-colors cursor-pointer">
                    <i class="fa-regular fa-heart text-xl"></i>
                    <span class="text-sm font-medium">1.2k</span>
                </button>
                <button type="button" class="flex items-center gap-2 text-blue-950 hover:text-red-500 transition-colors cursor-pointer">
                    <i class="fa-regular fa-comment text-xl"></i>
                    <span class="text-sm font-medium">143</span>
                </button>
                <button type="button" class="flex items-center gap-2 text-blue-950 hover:text-red-500 transition-colors cursor-pointer">
                    <i class="fa-regular fa-bookmark text-xl"></i>
                    <span class="text-sm font-medium">Save</span>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
