
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="../1-tailwind-offline/src/output.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      @theme {
        --font-sans: "Inter", sans-serif;
      }
    </style>
  </head>

  <body class="relative min-h-screen bg-[#030923]">

    <!-- OVERLAY -->
    <div
      id="menuOverlay"
      class="fixed inset-0 z-40 bg-[#030923] opacity-0 invisible transition-all duration-300 lg:hidden"
    ></div>

    <!-- HEADER -->
    <header
      class="mx-auto fixed w-full h-fit lg:h-18.25 mt-[clamp(29px,19.2407px+2.4833vw,55px)] z-50"
    >
      <!-- CUSTOM CONTAINER -->
      <div class="px-8.5 relative h-full">

        <!-- CAPSULE WRAPPER -->
        <div
          class="capsule-wapper lg:bg-white/30 transition duration-300 rounded-full w-full h-full flex justify-between items-center"
        >

          <!-- HEADER TITLE -->
          <h2
            class="lg:ml-13 transition-[margin-left] duration-800 italic text-[clamp(18px,13.4957px+1.1461vw,30px)] text-white font-bold"
          >
            <span class="text-[#505dff]">O</span>BJECTOR
          </h2>

          <!-- NAV MENU -->
          <nav
            id="mobileMenu"
            class="opacity-0 invisible translate-x-full transition-all duration-300
            lg:opacity-100 lg:visible lg:translate-x-0
            right-0 lg:static lg:w-fit absolute top-[calc(100%+16px)]
            w-[calc(100%-2*16px)] h-fit"
          >
            <ul class="flex flex-col lg:flex-row gap-9.75 text-white">
              <li>
                <a href="" class="text-[20px] font-semibold">HOME</a>
              </li>
              <li>
                <a href="" class="text-[20px] font-semibold">ABOUT</a>
              </li>
              <li>
                <a href="" class="text-[20px] font-semibold">SERVICE</a>
              </li>
              <li>
                <a href="" class="text-[20px] font-semibold">PROCESS</a>
              </li>
              <li>
                <a href="" class="text-[20px] font-semibold">CLIENT</a>
              </li>
            </ul>
          </nav>

          <!-- CONTACT LINK -->
          <a
            class="mr-2.5 hidden lg:flex font-semibold text-[20px] h-13.75 absolute translate-x-full rounded-full items-center justify-center right-0 lg:translate-x-0 lg:static button top-[calc(100%+208px)] w-[calc(100%-2*16px)] lg:w-40 bg-white"
            href="#contact"
          >
            SIGN UP
          </a>

          <!-- HAMBURGER BUTTON -->
          <button
            id="toggleMenu"
            type="button"
            class="lg:hidden focus:outline-none w-5.25 h-2.75"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="mobileMenu"
          >
            <img
              src="./assets/icons/hamburger.png"
              alt=""
            />
          </button>

        </div>
      </div>
    </header>

    <!-- HERO -->
    <section class="h-[clamp(881px,840.4613px+10.3152vw,989px)]">

      <!-- HEADER TEXT -->
      <div class="text-white text-center pt-23 flex flex-col space-y-[-18px]">
        <p class="font-semibold text-[18px]">CREATE 3D AI GENERATED</p>
        <h1 class="font-semibold text-[87px]">OBJECT</h1>
      </div>

      <!-- IMG CONTAINER -->
      <img
        class="absolute w-full z-30 top-95 left-1/2 translate-y-[-50%] translate-x-[-50%]"
        src="./assets/images/effect-mobile.png"
        alt="effect"
      />

      <img
        class="absolute top-55 size-85.75 left-1/2 translate-x-[-50%]"
        src="./assets/images/object.png"
        alt="object"
      />

      <!-- CONTENT TEXT -->
      <p class="pt-85 font-sans text-white text-center uppercase text-[14px]">
        Lorem ipsum dolor sit amet, consectetur <br />
        adipiscing elit, sed do eiusmod tempor <br />
        incididunt ut labore et dolore magna aliqua.
      </p>

      <!-- BUTTONS -->
      <div class="w-full pt-6 flex items-center justify-center gap-5">

        <!-- SIGN UP -->
        <a
          class="w-56 h-15 bg-white grid place-items-center rounded-full font-semibold text-[20px] outline outline-6 outline-white/15"
          href=""
        >
          SIGN UP
        </a>

        <!-- CALL -->
        <a
          class="flex rounded-full grid place-items-center bg-white size-15 outline outline-6 outline-white/15"
          href=""
        >
          <img src="./assets/icons/phone.png" alt="call" />
        </a>

      </div>

      <!-- SCROLL ICON -->
      <div
        class="w-9.25 h-10.25 bg-linear-to-b from-white/5 to-white/50 mt-6 mx-auto rounded-full grid place-items-center"
      >
        <img src="./assets/icons/arrow.png" alt="" />
      </div>

    </section>

    <!-- JAVASCRIPT -->
    <script>
      const toggleMenu = document.getElementById("toggleMenu");
      const mobileMenu = document.getElementById("mobileMenu");
      const menuOverlay = document.getElementById("menuOverlay");

      function openMenu() {
        mobileMenu.classList.remove(
          "opacity-0",
          "invisible",
          "translate-x-full"
        );

        menuOverlay.classList.remove("opacity-0", "invisible");

        toggleMenu.setAttribute("aria-expanded", "true");
        toggleMenu.setAttribute("aria-label", "Close menu");
      }

      function closeMenu() {
        mobileMenu.classList.add(
          "opacity-0",
          "invisible",
          "translate-x-full"
        );

        menuOverlay.classList.add("opacity-0", "invisible");

        toggleMenu.setAttribute("aria-expanded", "false");
        toggleMenu.setAttribute("aria-label", "Open menu");
      }

      toggleMenu.addEventListener("click", () => {
        const isOpen =
          toggleMenu.getAttribute("aria-expanded") === "true";

        if (isOpen) {
          closeMenu();
        } else {
          openMenu();
        }
      });

      // Klik overlay untuk menutup menu
      menuOverlay.addEventListener("click", closeMenu);

      // Klik navigasi untuk menutup menu
      mobileMenu.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", closeMenu);
      });

      // Jika viewport berubah ke desktop, reset kondisi mobile
      window.addEventListener("resize", () => {
        if (window.innerWidth >= 1024) {
          closeMenu();
        }
      });
    </script>

  </body>
</html>
