<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="h-screen bg-[#030923] text-white">
    <!-- CALC -->
    <h1>Contoh Calc</h1>
    <p>kotak putih tanpa calc</p>
    <div class="size-50 bg-white"></div>
    <p>kotak putih dengan calc</p>
    <div class="size-[calc(100px+100px)] bg-white"></div> 

    <!-- CLAMP -->
    <h1>Contoh kotak clamp</h1>
    <div class="mx-auto size-[clamp(40px,-320.3438px+91.6905vw,1000px)] bg-white"></div>  
  </body>
</html>
