<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="grid min-h-screen place-items-center">
    <div
      class="card bg-amber-300 w-[300px] h-[400px] rounded-xl overflow-hidden"
    >
      <div class="top relative">
        <!-- IMAGE -->
        <img src="./assets/images/lambo.png" alt="lamber lember" />
        <!-- LABEL -->
        <div
          class="absolute top-3 left-3 label-wrapper bg-blue-600 py-1 px-2 rounded-lg"
        >
          <p class="text-white text-xs">Premium</p>
        </div>
        <!-- PRICE -->
        <p class="absolute bottom-4 left-3 text-white font-bold text-sm">
          Rp 22.000.000.000 
        </p> 
        <!-- SELECTORS -->
        <div class="absolute flex bottom-[5px] left-[50%] translate-x-[-50%] gap-1 items-center"> 
          <div class="selector1 bg-white size-[7px] rounded-full"></div>
          <div class="selector1 bg-white/50 size-[7px] rounded-full"></div>
          <div class="selector1 bg-white/50 size-[7px] rounded-full"></div>
          <div class="selector1 bg-white/50 size-[7px] rounded-full"></div>
          <div class="selector1 bg-white/50 size-1 rounded-full"></div>
        </div> 
        <!-- HEART CONTAINER -->
        <div class="absolute size-7 rounded-full top-3 right-3 bg-white grid place-items-center "> 
          <img class="size-4" src="./assets/icons/heart.svg" alt="heart icon">    
        </div>
        <!-- IMAGES ICON --> 
        <div class="absolute flex bottom-4 right-3 gap-1 px-2 py-1 justify-center items-center bg-black rounded-md">    
          <img class="size-3" src="./assets/icons/image.svg" alt="img icon">
          <p class="text-white text-[10px]">11</p> 
        </div>
      </div>
    </div>
  </body>
</html>
