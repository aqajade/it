<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="grid place-items-center min-h-screen bg-[#f1f7fc]">
    <div class="card flex flex-col overflow-hidden rounded-lg h-75 w-62.5 bg-[#F8F8F8] shadow-[0px_0px_8px_black]"> 
      <div class="image-container w-full h-[60%]">
        <img class="w-full h-full" src="./assets/images/Bikaner-Rajasthan.png" alt="" />
      </div>
      <div class="card-content flex justify-between h-[40%] w-full p-4">
        <div class="card-left flex flex-col gap-1"> 
          <div class="font-serif card-header flex flex-col">
            <h3 class="card-heading -mb-1.25 text-[20px]">Bikaner</h3>
            <p class="card-paragraph text-[14px]    text-[#5c6c7a]">Rajashtan</p>
          </div>
          <p class="price font-semibold text-[16px]">₹ 2500/-</p>
        </div>
        <div class="card-right flex h-full items-end">
          <a class="font-sans flex items-center button border-[1.4px] border-[#77a9dc] text-[#438cd6] px-3.5 py-2 rounded-md text-[12px]" href="">Book</a>
        </div>
      </div>
    </div>
  </body>
</html>
