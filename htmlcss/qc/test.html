<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    a{
      color: black;
      text-decoration: none;
    }
    li{
      list-style: none;
    }
    header {
      background-color: rgb(93, 145, 234);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-inline: 12px;
      border-radius: 99px;
      height: 30px; 
    }
    header a{
      color: white;
    }
    nav ul{
      display: flex;
      gap: 8px; 
      align-items: center;
    }
    ul li{
      display: flex;
    }
    ul a{ 
      font-size: 10px; 
    }
  </style>
</head>
<body>
  <header>
    <a href="">
      <strong>Reza</strong>
    </a>
    <nav>
      <ul>
        <li>
          <a href="">Portfolio</a>
        </li>
        <li>
          <a href="">About</a>
        </li>
        <li>
          <a href="">Contact</a>
        </li>
      </ul>
    </nav>
  </header>
</body>
</html>
