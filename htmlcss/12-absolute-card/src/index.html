<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card-container">
      <div class="card">
        <div class="price-container">
          <p class="price">£15</p>
        </div>
        <img src="../assets/images/1-lamp.png" alt="lamp" />
        <div class="card-content">
          <div class="card-text">
            <p class="category">ACCESSORIES</p>
            <h3 class="card-title">DESK LAMP</h3>
            <div class="separator"></div>
            <p class="card-detail">
              You can easily direct the light where you want it
              <br />
              because the lamp arm and head are adjustable.
            </p>
            <p class="card-detail">
              Light bulb sold separately.
              <br />
              Minimal Decor recommends LED bulb E14 400 lumen chandelier opal
              white.
            </p>
          </div>
          <button>ADD TO SHOPPING BAG</button>
        </div>
      </div>
    </div>
  </body>
</html>
