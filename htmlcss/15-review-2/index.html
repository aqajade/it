<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- <link rel="stylesheet" href="style.css" /> -->
    <style>
      * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  display: grid;
  place-items: center;
  min-height: 100vh;
}
.card-container {
  background-color: aqua;
  width: 100%;
  display: flex;
  justify-content: center;
}
.card {
  background-color: rgb(236, 236, 80);
  width: 200px;
  height: 300px;
  border-radius: 20px;
  box-shadow: 0px 5px 10px 5px #807c81;
  overflow: hidden;
}
.label{
  background-color: yellow;
  width: 100px;
  height: 100px;
  position: absolute;
  border-radius: 50%;
  transform: translate(-40%,-40%);
  display: grid;
  place-items: center;
}
.card-top{
  background-color: green;
  width: 100%;
  height: 40%;
}
.card-bottom{
  background-color: orangered;
  width: 100%;
  height:60%;
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.card-header{
  display: flex;
  flex-direction: column;
  gap: 10px;
  background-color: tomato;
}
.card-title{
  background-color: yellow;
}
.card-description{
  background-color: ivory;
}
.price{
  text-align: right;
}


    </style>
  </head>
  <body>
    <div class="card-container">
      <div class="card">
        <div class="label">
          <h3>ready</h3>
        </div>
        <div class="card-top"></div>
        <div class="card-bottom">
          <div class="card-header">
            <h3 class="card-title">teks1</h3>
            <p class="card-description">teks2</p>
          </div>
          <h2 class="price">teks3</h2>
        </div>
      </div>
    </div>
  </body>
</html>
