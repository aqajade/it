<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card-container">
      <div class="card">
        <!-- LABEL -->
        <div class="discount-top">
          <div class="discount-bottom"></div>
          <p>94%</p>
        </div>
        <!-- IMG -->
        <img
          class="top-img"
          src="./assets/images/product.webp"
          alt="product image"
        />
        <!-- CARD BOTTOM -->
        <div class="card-bottom">
          <!-- TITLE -->
          <h2>ACOME Wired In Ear Metal ...</h2>
          <!-- PRICE -->
          <div class="price-container">
            <div class="voucher-container">
              <img src="./assets/icons/discount.png" alt="voucher" />
              <p class="voucher-text">Rp5.900</p>
            </div>
            <p class="price">Rp.100.000</p>
          </div>
          <!-- DESC -->
          <p class="description">Hemat s.d 3% Pakai Bonus</p>
          <!-- RATING -->
          <div class="rating-container">
            <div class="star-container">
              <img src="./assets/icons/star.svg" alt="star icon" />
              <p class="rating-number">4.8</p>
            </div>

            <div class="dot"></div>
            <p class="rating-description">2rb+ terjual</p>
          </div>
          <!-- STORE -->
          <div class="store-container">
            <img src="./assets/icons/check.png" alt="verified check">
            <p>ACOME IOT INDONESIA</p>
          </div>
          <!-- THREE DOTS -->
          <div class="three-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
