<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card-container">
      <div class="card">
        <!-- LABEL -->
        <div class="discount-top">
          <div class="discount-bottom"></div>
          <p>94%</p>
        </div>
        <!-- IMG -->
        <img
          class="top-img"
          src="./assets/images/product.webp"
          alt="product image"
        />
        <!-- CARD BOTTOM -->
        <div class="card-bottom">
          <h2>ACOME WIRED in Metal ...</h2>
          <div class="price-container">
            <div class="voucher-container">
              <img src="./assets/icons/discount.png" alt="voucher" />
              <p class="voucher-text">Rp5.900</p>
            </div>
            <p class="price">Rp.</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
