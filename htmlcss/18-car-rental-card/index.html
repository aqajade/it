<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bismillah fathan alkha semangat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card-container">
    <div class="card">
      <!-- IMAGE -->
      <img src="./assets/images/lamborghini.png" alt="lamborghini">
      <!-- CONTENT -->
      <div class="card-content">
        <!-- TITLE -->
        <h3>Lamborghini Huracán</h3>
        <!-- CARD INFO -->
        <div class="card-info">
          <p>Sports Car</p>
          <div class="dot"></div>
          <p>2 Seats</p>
        </div>
        <!-- CARD DETAIL -->
        <div class="card-detail">
          <div class="transmission-detail">
            <img src="./assets/icons/speedometer.png" alt="automatic transmission">
            <p>Auto</p>
          </div>
          <div class="fuel-detail">
            <img src="./assets/icons/petrol.png" alt="petrol fuel">
            <p>Petrol</p>
          </div>
        </div>
        <!-- PRICE -->
        <div class="price">
          <p class="price-value">$299</p>
          <p class="price-detail">/day</p>
        </div>
        <!-- CTA -->
        <a href="">
          <img src="./assets/icons/arrow.png" alt="rent the car">
        </a>
      </div>
    </div>
  </div>
</body>
</html>
